version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-db
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: lifehub
      POSTGRES_DB: lifehub
    ports:
      - '5434:5432'
    volumes:
      - /mnt/dados/lifehub/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lifehub-redis
    ports:
      - '6379:6379'
    restart: unless-stopped
